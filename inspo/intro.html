<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name</title>
<style>
  :root{
    --ivory:#EEFEEE;
    --klein:#002FA7;
    /* World reference canvas: 1600 x 900. --u = px per world-unit, fit to width AND height so
       nothing overflows on very narrow or very tall viewports. Same --u drives both hands, so
       they are always scaled by an identical factor relative to each other. */
    --u: min(calc(100vw / 1600), calc(100vh / 900));
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:var(--klein); overflow:hidden; }
  body{ font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* ---------- INTRO ---------- */
  #intro{
    position:fixed; inset:0;
    background:var(--klein);
    overflow:hidden;
    z-index:100;
    transition: opacity .9s ease;
  }
  #intro.gone{ opacity:0; pointer-events:none; }

  .hand-wrap{
    position:absolute;
    top:0; left:0;
    opacity:0;
    transition: left 1.4s cubic-bezier(.4,0,.2,1), opacity .5s ease;
    will-change: left;
  }
  .hand-wrap.visible{ opacity:1; }

  .hand-svg{
    display:block;
    fill:var(--ivory);
  }

  /* left hand (Adam) — reaches in from the left, fingertip points toward center */
  #handLeftWrap{
    top:  calc(var(--u) * 286);
    left: calc(var(--u) * 378);
  }
  #handLeftWrap.touching{ left: calc(var(--u) * 398); }
  #handLeftWrap .hand-svg{
    width:  calc(var(--u) * 460);
    height: calc(var(--u) * 170);
  }

  /* right hand (Creator) — reaches in from the right, fingertip points toward center */
  #handRightWrap{
    top:  calc(var(--u) * 165.8);
    left: calc(var(--u) * 697.6);
  }
  #handRightWrap.touching{ left: calc(var(--u) * 677.6); }
  #handRightWrap .hand-svg{
    width:  calc(var(--u) * 460);
    height: calc(var(--u) * 290);
  }

  #spark{
    position:absolute;
    left: calc(var(--u) * 800);
    top:  calc(var(--u) * 450);
    width:10px; height:10px;
    border-radius:50%;
    background: radial-gradient(circle, #fff 0%, var(--ivory) 40%, rgba(238,254,238,0) 72%);
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
  }
  #spark.fire{ animation: sparkPulse .6s ease-out forwards; }
  @keyframes sparkPulse{
    0%{ transform:translate(-50%,-50%) scale(0); opacity:0; }
    18%{ opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(13); opacity:0; }
  }

  /* ---------- SITE CONTENT ---------- */
  #site{
    min-height:100%;
    background:#fff;
    color:#111;
    opacity:0;
    transform: translateY(14px);
    transition: opacity .9s ease, transform .9s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10vh 6vw;
  }
  #site.visible{ opacity:1; transform:translateY(0); }
  #site h1{ font-size:clamp(28px,5vw,56px); margin:0 0 12px; }
  #site p{ font-size:clamp(14px,1.6vw,18px); color:#555; max-width:520px; }
</style>
</head>

<script>
(function(){
  var handLeft  = document.getElementById('handLeftWrap');
  var handRight = document.getElementById('handRightWrap');
  var intro     = document.getElementById('intro');
  var site      = document.getElementById('site');
  var spark     = document.getElementById('spark');

  requestAnimationFrame(function(){
    handLeft.classList.add('visible');
    handRight.classList.add('visible');
  });

  setTimeout(function(){
    handLeft.classList.add('touching');
    handRight.classList.add('touching');
  }, 450);

  var contacted = false;
  handLeft.addEventListener('transitionend', function(e){
    if (e.propertyName !== 'left' || contacted) return;
    contacted = true;

    spark.classList.add('fire');
    intro.classList.add('gone');
    site.classList.add('visible');
  });
})();
</script>
